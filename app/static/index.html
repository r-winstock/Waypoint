<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — your own timeline</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Bevan&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/theme-atlas.css">
<link rel="stylesheet" href="/static/css/theme-voyage.css">
<link rel="stylesheet" href="/static/css/components.css">

<script>
  // Pre-paint theme application: avoids a flash of the wrong theme on load.
  (function () {
    const stored = localStorage.getItem('waypoint-theme') || 'atlas';
    document.documentElement.setAttribute('data-theme', stored);
  })();
</script>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/static/js/map.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="/static/js/app.js"></script>
</head>

<body class="antialiased">
<div x-data="waypoint()" x-init="init()">

  <header class="top-bar">
    <div class="max-w-[1400px] mx-auto px-6 py-3 flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-6 flex-wrap">
        <h1 class="text-xl font-bold display" style="color: var(--wp-fg-primary)">Waypoint</h1>
        <nav class="flex items-center gap-1 flex-wrap">
          <button class="nav-tab" :class="tab==='day' && 'active'" @click="switchTab('day')"><i data-lucide="calendar" class="w-4 h-4"></i> Day</button>
          <button class="nav-tab" :class="tab==='trips' && 'active'" @click="switchTab('trips')"><i data-lucide="briefcase" class="w-4 h-4"></i> Trips</button>
          <button class="nav-tab" :class="tab==='insights' && 'active'" @click="switchTab('insights')"><i data-lucide="bar-chart-2" class="w-4 h-4"></i> Insights</button>
          <button class="nav-tab" :class="tab==='places' && 'active'" @click="switchTab('places')"><i data-lucide="map-pin" class="w-4 h-4"></i> Places</button>
          <button class="nav-tab" :class="tab==='cities' && 'active'" @click="switchTab('cities')"><i data-lucide="building-2" class="w-4 h-4"></i> Cities</button>
          <button class="nav-tab" :class="tab==='world' && 'active'" @click="switchTab('world')"><i data-lucide="globe" class="w-4 h-4"></i> World</button>
        </nav>
      </div>

      <div class="relative" x-data="{}" @click.outside="themeMenuOpen = false">
        <button class="btn-icon" @click="themeMenuOpen = !themeMenuOpen" title="Change theme">
          <i data-lucide="palette" class="w-4 h-4"></i>
        </button>
        <div x-show="themeMenuOpen" x-transition class="theme-menu" style="display: none">
          <button :class="theme==='atlas' && 'active'" @click="setTheme('atlas')"><i data-lucide="moon" class="w-4 h-4"></i> Atlas</button>
          <button :class="theme==='voyage' && 'active'" @click="setTheme('voyage')"><i data-lucide="scroll" class="w-4 h-4"></i> Voyage</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-[1400px] mx-auto px-6 py-6">

    <!-- ═══════════ DAY ═══════════ -->
    <div x-show="tab==='day'">
      <div class="flex items-center justify-between mb-4">
        <button class="btn-icon" @click="changeDay(-1)"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <div class="text-lg font-semibold display" x-text="new Date(day.date).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'})"></div>
        <button class="btn-icon" @click="changeDay(1)"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>

      <template x-if="day.data">
        <div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
            <template x-for="s in dayStatModes()" :key="s.mode">
              <div class="stat-tile">
                <div class="label capitalize" x-text="s.mode"></div>
                <div class="value" x-text="formatMiles(s.distance_m)"></div>
                <div class="detail" x-text="formatDuration(s.duration_s)"></div>
              </div>
            </template>
            <div class="stat-tile">
              <div class="label">Visits</div>
              <div class="value" x-text="day.data.stats.visits"></div>
              <div class="detail">places stayed</div>
            </div>
          </div>

          <div id="map-container" class="mb-5"></div>

          <template x-if="!day.data.timeline.length">
            <div class="empty-state">No location data for this day yet.</div>
          </template>

          <div>
            <template x-for="entry in day.data.timeline" :key="entry.type + '-' + entry.id">
              <div class="day-row">
                <div class="flex flex-col items-center">
                  <div class="timeline-badge" :style="entry.type==='visit' ? '' : `background: var(--wp-mode-${entry.mode}); border-color: var(--wp-mode-${entry.mode})`">
                    <i x-show="entry.type==='segment'" :data-lucide="modeIcon(entry.mode)" class="w-3.5 h-3.5" style="color: white"></i>
                    <span x-show="entry.type==='visit'" x-text="categoryIcon(entry.category)" style="font-size: 14px; line-height: 1"></span>
                  </div>
                  <div class="line" :style="`height: ${entryLineHeight(entry.start_ts, entry.end_ts)}px`"></div>
                </div>
                <div class="flex-1 pb-2">
                  <template x-if="entry.type==='visit'">
                    <div>
                      <div class="flex items-center gap-2">
                        <div class="font-semibold" x-text="entry.place_name || 'Unnamed place'"></div>
                        <button class="btn-icon" style="width: 24px; height: 24px" title="This place is wrong? Fix it"
                                @click="openPlaceEdit(entry.place_id, entry.place_name, entry.category, entry.city, null, null)">
                          <i data-lucide="pencil" class="w-3 h-3"></i>
                        </button>
                        <button class="btn-icon" style="width: 24px; height: 24px" title="Merge into previous visit" x-show="canMergeUp(entry)"
                                @click="mergeWithPrevious(entry)">
                          <i data-lucide="git-merge" class="w-3 h-3"></i>
                        </button>
                        <button class="btn-icon" style="width: 24px; height: 24px" title="Delete this visit" @click="deleteVisit(entry)">
                          <i data-lucide="trash-2" class="w-3 h-3"></i>
                        </button>
                      </div>
                      <div class="text-sm" style="color: var(--wp-fg-muted)" x-text="[entry.city, formatTime(entry.start_ts) + ' – ' + formatTime(entry.end_ts)].filter(Boolean).join(' · ')"></div>
                      <span class="pill mt-1" :class="'pill-cat-' + slugify(entry.category)" x-show="entry.category" x-text="entry.category"></span>
                    </div>
                  </template>
                  <template x-if="entry.type==='segment'">
                    <div>
                      <div class="flex items-center gap-2">
                        <div class="font-medium capitalize" x-text="entry.mode"></div>
                        <button class="btn-icon" style="width: 24px; height: 24px" title="This was actually a stop - convert to a visit"
                                @click="openConvertSegment(entry)">
                          <i data-lucide="map-pin-plus" class="w-3 h-3"></i>
                        </button>
                        <button class="btn-icon" style="width: 24px; height: 24px" title="Delete this segment" @click="deleteSegment(entry)">
                          <i data-lucide="trash-2" class="w-3 h-3"></i>
                        </button>
                      </div>
                      <div class="text-sm" style="color: var(--wp-fg-muted)" x-text="formatMiles(entry.distance_m) + ' · ' + formatDuration(entry.duration_s)"></div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- ═══════════ TRIPS ═══════════ -->
    <div x-show="tab==='trips'">
      <template x-if="!trips.detail && !trips.detailLoading">
        <div>
          <div id="trips-map-container" class="mb-5"></div>
          <template x-if="trips.data">
            <div>
              <div class="flex gap-6 mb-5">
                <div><span class="text-2xl font-bold tabular" x-text="trips.data.totals.trip_count"></span> <span style="color: var(--wp-fg-muted)">trips</span></div>
                <div><span class="text-2xl font-bold tabular" x-text="trips.data.totals.day_count"></span> <span style="color: var(--wp-fg-muted)">days</span></div>
              </div>
              <template x-if="!trips.data.trips.length">
                <div class="empty-state">No trips detected yet — set a home location in Settings so Waypoint can tell when you're away.</div>
              </template>
              <div class="grid-cards">
                <template x-for="t in trips.data.trips" :key="t.id">
                  <div class="trip-card" @click="openTrip(t.id)">
                    <div class="banner"><div class="title" x-text="t.primary_city || t.primary_country || 'Trip'"></div></div>
                    <div class="body">
                      <div class="text-sm" style="color: var(--wp-fg-muted)" x-text="formatDateRange(t.start_ts, t.end_ts)"></div>
                      <div class="text-sm mt-1" x-text="t.days + ' day' + (t.days > 1 ? 's' : '') + (t.primary_country ? ' · ' + t.primary_country : '')"></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <template x-if="trips.detailLoading">
        <div class="empty-state">Loading trip…</div>
      </template>

      <template x-if="trips.detail">
        <div>
          <button class="nav-tab mb-3" @click="closeTrip()"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to trips</button>
          <div class="text-lg font-semibold display mb-1" x-text="trips.detail.primary_city || trips.detail.primary_country || 'Trip'"></div>
          <div class="text-sm mb-4" style="color: var(--wp-fg-muted)" x-text="formatDateRange(trips.detail.start_ts, trips.detail.end_ts) + ' · ' + trips.detail.days + ' day' + (trips.detail.days > 1 ? 's' : '')"></div>

          <div id="trip-detail-map-container" class="mb-5"></div>

          <template x-if="!trips.detail.timeline.length">
            <div class="empty-state">No visit or travel data recorded for this trip.</div>
          </template>
          <div>
            <template x-for="entry in trips.detail.timeline" :key="entry.type + '-' + entry.id">
              <div class="day-row">
                <div class="flex flex-col items-center">
                  <div class="timeline-badge" :style="entry.type==='visit' ? '' : `background: var(--wp-mode-${entry.mode}); border-color: var(--wp-mode-${entry.mode})`">
                    <i x-show="entry.type==='segment'" :data-lucide="modeIcon(entry.mode)" class="w-3.5 h-3.5" style="color: white"></i>
                    <span x-show="entry.type==='visit'" x-text="categoryIcon(entry.category)" style="font-size: 14px; line-height: 1"></span>
                  </div>
                  <div class="line" :style="`height: ${entryLineHeight(entry.start_ts, entry.end_ts)}px`"></div>
                </div>
                <div class="flex-1 pb-2">
                  <template x-if="entry.type==='visit'">
                    <div>
                      <div class="font-semibold" x-text="entry.place_name || 'Unnamed place'"></div>
                      <div class="text-sm" style="color: var(--wp-fg-muted)" x-text="[entry.city, formatTime(entry.start_ts) + ' – ' + formatTime(entry.end_ts)].filter(Boolean).join(' · ')"></div>
                      <span class="pill mt-1" :class="'pill-cat-' + slugify(entry.category)" x-show="entry.category" x-text="entry.category"></span>
                    </div>
                  </template>
                  <template x-if="entry.type==='segment'">
                    <div>
                      <div class="font-medium capitalize" x-text="entry.mode"></div>
                      <div class="text-sm" style="color: var(--wp-fg-muted)" x-text="formatMiles(entry.distance_m) + ' · ' + formatDuration(entry.duration_s)"></div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- ═══════════ INSIGHTS ═══════════ -->
    <div x-show="tab==='insights'">
      <div class="flex items-center justify-between mb-4">
        <button class="btn-icon" @click="changeMonth(-1)"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <div class="text-lg font-semibold display" x-text="monthLabel()"></div>
        <button class="btn-icon" @click="changeMonth(1)"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>

      <template x-if="insights.data">
        <div>
          <h2 class="text-base font-semibold mb-2">Travel</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
            <template x-for="(t, mode) in insights.data.travel" :key="mode">
              <div class="stat-tile flex items-center justify-between">
                <div>
                  <div class="label capitalize" x-text="mode"></div>
                  <div class="value" x-text="formatMiles(t.distance_m)"></div>
                  <div class="detail" x-text="formatDuration(t.duration_s)"></div>
                </div>
                <div class="flex items-end gap-1" style="height: 32px">
                  <template x-for="(h, idx) in sparklineHeights(t.trend)" :key="idx">
                    <div class="sparkline-bar" :style="`height:${h}px; background: var(--wp-mode-${mode})`"></div>
                  </template>
                </div>
              </div>
            </template>
            <template x-if="!Object.keys(insights.data.travel).length">
              <div class="empty-state">No travel recorded this month.</div>
            </template>
          </div>

          <h2 class="text-base font-semibold mb-2">Visits</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <template x-for="(v, category) in insights.data.visits" :key="category">
              <div class="stat-tile flex items-center justify-between">
                <div>
                  <div class="label" x-text="category"></div>
                  <div class="value" x-text="formatDuration(v.duration_s)"></div>
                  <button class="text-xs mt-1" style="color: var(--wp-accent-light)" @click="switchTab('places'); openCategory(category)">See places</button>
                </div>
                <div class="flex items-end gap-1" style="height: 32px">
                  <template x-for="(h, idx) in sparklineHeights(v.trend)" :key="idx">
                    <div class="sparkline-bar" :style="`height:${h}px`"></div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- ═══════════ PLACES ═══════════ -->
    <div x-show="tab==='places'">
      <template x-if="!places.category">
        <div>
          <template x-if="places.data && !places.data.categories.length">
            <div class="empty-state">No places resolved yet.</div>
          </template>
          <div class="grid-cards">
            <template x-for="c in (places.data ? places.data.categories : [])" :key="c.name">
              <div class="grid-card" @click="openCategory(c.name)">
                <span class="count-badge" x-text="c.count"></span>
                <div class="text-2xl" x-text="categoryIcon(c.name)"></div>
                <div class="title" x-text="c.name"></div>
                <div class="subtitle" x-text="c.count + ' places'"></div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template x-if="places.category">
        <div>
          <button class="nav-tab mb-3" @click="closeCategory()"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to categories</button>
          <h2 class="text-lg font-semibold mb-3 display" x-text="places.category"></h2>
          <div class="grid-cards">
            <template x-for="p in (places.categoryData ? places.categoryData.places : [])" :key="p.id">
              <div class="grid-card" style="cursor: default">
                <button class="btn-icon" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px" title="This place is wrong? Fix it"
                        @click="openPlaceEdit(p.id, p.name, places.category, p.city, null, null)">
                  <i data-lucide="pencil" class="w-3 h-3"></i>
                </button>
                <div class="title" x-text="p.name || 'Unnamed place'"></div>
                <div class="subtitle" x-text="p.city || ''"></div>
                <div class="text-xs mt-2" style="color: var(--wp-fg-dim)" x-text="p.visit_count + ' visit' + (p.visit_count > 1 ? 's' : '') + ' · last ' + formatRelative(p.last_visit_ts)"></div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- ═══════════ CITIES ═══════════ -->
    <div x-show="tab==='cities'">
      <template x-if="cities.data && !cities.data.cities.length">
        <div class="empty-state">No cities visited yet.</div>
      </template>
      <div class="grid-cards">
        <template x-for="c in (cities.data ? cities.data.cities : [])" :key="c.name">
          <div class="grid-card" style="cursor: default">
            <span class="count-badge" x-text="c.place_count + ' place' + (c.place_count === 1 ? '' : 's')"></span>
            <div class="title" x-text="c.name"></div>
            <div class="subtitle" x-text="formatRelative(c.last_visit_ts)"></div>
          </div>
        </template>
      </div>
    </div>

    <!-- ═══════════ WORLD ═══════════ -->
    <div x-show="tab==='world'">
      <template x-if="world.data && !world.data.countries.length">
        <div class="empty-state">No countries visited yet.</div>
      </template>
      <div class="grid-cards">
        <template x-for="c in (world.data ? world.data.countries : [])" :key="c.name">
          <div class="grid-card" style="cursor: default">
            <span class="count-badge" x-text="c.city_count + ' cit' + (c.city_count === 1 ? 'y' : 'ies')"></span>
            <div class="text-2xl" x-text="countryFlag(c.country_code)"></div>
            <div class="title" x-text="c.name"></div>
            <div class="subtitle" x-text="formatRelative(c.last_visit_ts)"></div>
          </div>
        </template>
      </div>
    </div>

  </main>

  <!-- ═══════════ PLACE CORRECTION MODAL ═══════════ -->
  <!-- No x-transition here deliberately: it desynced from placeEdit.open on
       rapid toggles, leaving the backdrop's real display:flex in place while
       Alpine's state said closed - invisibly eating clicks underneath
       (that's what broke the Places-drilldown edit pencil). Plain x-show
       sets display synchronously with no animation-completion step to lose. -->
  <div class="modal-backdrop" x-show="placeEdit.open" @click.self="closePlaceEdit()" style="display: none">
    <div class="modal">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold display">Fix this place</h3>
        <button class="btn-icon" @click="closePlaceEdit()"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <label class="field-label">Name</label>
      <input type="text" class="field-input" x-model="placeEdit.name">

      <label class="field-label">Category</label>
      <select class="field-input" x-model="placeEdit.category">
        <template x-for="opt in categoryOptions" :key="opt">
          <option :value="opt" x-text="opt"></option>
        </template>
      </select>

      <label class="field-label">Nearby alternatives</label>
      <div x-show="placeEdit.loadingAlternatives" class="text-sm mb-3" style="color: var(--wp-fg-muted)">Looking nearby…</div>
      <div x-show="!placeEdit.loadingAlternatives && !placeEdit.alternatives.length" class="text-sm mb-3" style="color: var(--wp-fg-muted)">Nothing named found nearby.</div>
      <div class="mb-3">
        <template x-for="alt in placeEdit.alternatives" :key="alt.osm_type + alt.osm_id">
          <button type="button" class="alt-option" @click="selectAlternative(alt)">
            <div class="flex items-center justify-between">
              <span x-text="alt.name"></span>
              <span class="text-xs" style="color: var(--wp-fg-dim)" x-text="alt.distance_m + 'm'"></span>
            </div>
            <div class="text-xs" style="color: var(--wp-fg-dim)" x-text="alt.category"></div>
          </button>
        </template>
      </div>

      <label class="field-label">Can't find it nearby? Search by name</label>
      <div class="flex gap-2 mb-2">
        <input type="text" class="field-input" placeholder="e.g. The Kilmurry Lodge Hotel" x-model="placeEdit.searchQuery" @keydown.enter="searchPlaces()">
        <button type="button" class="btn-ghost" :disabled="placeEdit.searching" @click="searchPlaces()">
          <span x-text="placeEdit.searching ? 'Searching…' : 'Search'"></span>
        </button>
      </div>
      <div class="mb-3">
        <template x-for="result in placeEdit.searchResults" :key="result.display_name">
          <button type="button" class="alt-option" @click="selectSearchResult(result)">
            <div class="flex items-center justify-between">
              <span x-text="result.name"></span>
              <span class="text-xs" style="color: var(--wp-fg-dim)" x-show="result.distance_m != null" x-text="(result.distance_m/1000).toFixed(1) + ' km'"></span>
            </div>
            <div class="text-xs" style="color: var(--wp-fg-dim)" x-text="result.display_name"></div>
          </button>
        </template>
      </div>

      <template x-if="!placeEdit.loadingSimilar && placeEdit.similar.length">
        <div class="mb-3">
          <label class="field-label">Also apply to other places named the same nearby</label>
          <template x-for="s in placeEdit.similar" :key="s.id">
            <label class="alt-option flex items-center gap-2" style="cursor: pointer">
              <input type="checkbox" :value="s.id" @change="toggleMerge(s.id)">
              <span x-text="(s.city || 'Unknown') + ' · ' + s.visit_count + ' visit' + (s.visit_count > 1 ? 's' : '') + ' · ' + (s.distance_m/1000).toFixed(1) + ' km away'"></span>
            </label>
          </template>
        </div>
      </template>

      <div class="flex justify-end gap-2 mt-4">
        <button class="btn-ghost" @click="closePlaceEdit()">Cancel</button>
        <button class="btn-primary" :disabled="placeEdit.saving" @click="savePlaceEdit()">
          <span x-text="placeEdit.saving ? 'Saving…' : (placeEdit.mergeIds.length ? `Save & merge ${placeEdit.mergeIds.length}` : 'Save')"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════ CONVERT SEGMENT TO VISIT MODAL ═══════════ -->
  <div class="modal-backdrop" x-show="segmentConvert.open" @click.self="closeConvertSegment()" style="display: none">
    <div class="modal">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold display">This was actually a stop</h3>
        <button class="btn-icon" @click="closeConvertSegment()"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <label class="field-label">Search for the place</label>
      <div class="flex gap-2 mb-2">
        <input type="text" class="field-input" placeholder="e.g. Iceland Supermarket" x-model="segmentConvert.searchQuery" @keydown.enter="searchConvertPlaces()">
        <button type="button" class="btn-ghost" :disabled="segmentConvert.searching" @click="searchConvertPlaces()">
          <span x-text="segmentConvert.searching ? 'Searching…' : 'Search'"></span>
        </button>
      </div>
      <div class="mb-3">
        <template x-for="result in segmentConvert.searchResults" :key="result.display_name">
          <button type="button" class="alt-option" @click="selectConvertResult(result)">
            <div class="flex items-center justify-between">
              <span x-text="result.name"></span>
              <span class="text-xs" style="color: var(--wp-fg-dim)" x-show="result.distance_m != null" x-text="(result.distance_m/1000).toFixed(1) + ' km'"></span>
            </div>
            <div class="text-xs" style="color: var(--wp-fg-dim)" x-text="result.display_name"></div>
          </button>
        </template>
      </div>

      <label class="field-label">Name</label>
      <input type="text" class="field-input" x-model="segmentConvert.name">

      <label class="field-label">Category</label>
      <select class="field-input" x-model="segmentConvert.category">
        <template x-for="opt in categoryOptions" :key="opt">
          <option :value="opt" x-text="opt"></option>
        </template>
      </select>

      <div class="flex justify-end gap-2 mt-4">
        <button class="btn-ghost" @click="closeConvertSegment()">Cancel</button>
        <button class="btn-primary" :disabled="segmentConvert.saving" @click="saveConvertSegment()">
          <span x-text="segmentConvert.saving ? 'Saving…' : 'Convert to visit'"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  // Lucide only ever draws an icon once, at createIcons() time - any
  // <i data-lucide="..."> Alpine adds afterwards (a new day's timeline rows,
  // a newly-opened category, etc.) stays an empty element until createIcons()
  // runs again. A MutationObserver-based retry was tried here and dropped -
  // it depends on catching every DOM write in the right order relative to
  // Alpine's own (deferred-script) render cycle, and in practice some
  // batches of newly-inserted icons were still missed for reasons that
  // didn't reproduce consistently enough to pin down. A plain poll sidesteps
  // all of that: it doesn't care what triggered a new unconverted icon or
  // when, it just periodically checks. The check itself is a single cheap
  // querySelector, so polling far more often than actually needed still
  // costs nothing meaningful in a personal, single-user app.
  document.addEventListener('DOMContentLoaded', () => {
    if (!window.lucide) return;
    lucide.createIcons();
    setInterval(() => {
      if (document.querySelector('i[data-lucide]')) lucide.createIcons();
    }, 300);
  });
</script>
</body>
</html>
